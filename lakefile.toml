name = "PastaLean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["PastaLean", "py2lean"]
testDriver = "palc"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`

[[require]]
name = "mathlib"
git  = "https://github.com/leanprover-community/mathlib4-nightly-testing.git"
rev  = "nightly-testing-2026-08-03"

[[lean_lib]]
name = "PastaLean"

[[lean_lib]]
name = "Libraries"

[[lean_lib]]
name = "TypeInfer"

[[lean_lib]]
name = "PALC"

# The shipped verification benchmark. Not a default target: 300 Mathlib-importing modules.
# Build it explicitly with `lake build PastaBench`.
[[lean_lib]]
name = "PastaBench"

[[lean_exe]]
name="py2lean"
supportInterpreter = true

[[lean_exe]]
name="palc"
root = "PALC.PastaCheck"
supportInterpreter = true

[[lean_lib]]
name = "CpHarness"
srcDir = "cp_harness/.native"

[[lean_exe]]
name = "cpharness_run"
srcDir = "cp_harness/.native"
root = "CpHarnessMain"
supportInterpreter = true
