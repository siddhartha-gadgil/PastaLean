name = "PastaLean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["PastaLean", "py2lean"]
testDriver = "palc"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`

[[require]]
name = "mathlib"
git  = "https://github.com/leanprover-community/mathlib4-nightly-testing.git"
rev  = "nightly-testing-2026-08-09"

[[lean_lib]]
name = "PastaLean"

[[lean_lib]]
name = "Libraries"

[[lean_lib]]
name = "TypeInfer"

[[lean_lib]]
name = "PALC"

# The shipped verification benchmark. Not a default target: 300 Mathlib-importing modules.
# Build it explicitly with `lake build PastaBench`.
[[lean_lib]]
name = "PastaBench"

# Separation-logic specs for `--heap`-translated Python (see PastaLean.PyAPI.Heap.Proof).
# Not a default target; build explicitly with `lake build HeapProofs`. Each example module is
# built as its own compilation unit (`globs` submodule pattern, no aggregator root) so their
# root-namespace `Val` inductives — reproduced verbatim from translator output — never collide.
[[lean_lib]]
name = "HeapProofs"
globs = ["HeapProofs.+"]

[[lean_exe]]
name="py2lean"
supportInterpreter = true

[[lean_exe]]
name="palc"
root = "PALC.PastaCheck"
supportInterpreter = true

[[lean_lib]]
name = "CpHarness"
srcDir = "cp_harness/.native"

[[lean_exe]]
name = "cpharness_run"
srcDir = "cp_harness/.native"
root = "CpHarnessMain"
supportInterpreter = true
