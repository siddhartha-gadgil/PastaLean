name = "PastaLean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["PastaLean", "py2lean"]
testDriver = "palc"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[require]]
name = "verso-slides"
scope = "leanprover"
rev = "v4.31.0"

[[require]]
name = "verso-snippets"
git = "https://github.com/AnirudhG07/verso-snippets"
rev = "master"

[[lean_lib]]
name = "PastaLean"

# Scratch target for `lean-snippet` (verso-snippets host mode): it copies the
# .lean being rendered to ./Snippet.lean and builds `Snippet:highlighted`.
[[lean_lib]]
name = "Snippet"

[[lean_lib]]
name = "Libraries"

[[lean_lib]]
name = "TypeInfer"

[[lean_lib]]
name = "PALC"

# The shipped verification benchmark. Not a default target: 300 Mathlib-importing modules.
# Build it explicitly with `lake build PastaBench`.
[[lean_lib]]
name = "PastaBench"

[[lean_lib]]
name = "Slides"
srcDir = "docs/ppt"

[[lean_exe]]
name = "slides"
srcDir = "docs/ppt"
root = "SlidesMain"
supportInterpreter = true

[[lean_exe]]
name="py2lean"
supportInterpreter = true

# Standalone whole-module type inference — pure `Json → Json`, no elaboration environment, so it skips
# the ~4 s Mathlib boot the full backend pays. Batches parallelise across cores in one process.
[[lean_exe]]
name="typeinfer"
root = "typeinfer_exe"

[[lean_exe]]
name="palc"
root = "PALC.PastaCheck"
supportInterpreter = true

[[lean_lib]]
name = "CpHarness"
srcDir = "cp_harness/.native"

[[lean_exe]]
name = "cpharness_run"
srcDir = "cp_harness/.native"
root = "CpHarnessMain"
supportInterpreter = true
